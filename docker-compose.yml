version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: atmograph_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI (http://localhost:7474)
      - "7687:7687"   # Bolt protocol for backend connection
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
